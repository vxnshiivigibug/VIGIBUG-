<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blog de vxnshii</title><meta name="description" content="Le blog de vxnshii : un plan, des articles et des outils pour atteindre les 200 premiers abonnés sur YouTube."><meta name="theme-color" content="#E3235F"><meta name="color-scheme" content="light dark"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Blog de vxnshii"><meta name="twitter:description" content="Un plan, des articles et des outils pour atteindre les 200 premiers abonnés sur YouTube."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><meta property="og:type" content="website"><meta property="og:title" content="Blog de vxnshii"><meta property="og:description" content="Le blog de vxnshii : un plan, des articles et des outils pour atteindre les 200 premiers abonnés sur YouTube."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23E3235F'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}

/* Layout: wide display type hero with a 200-square progress grid, then roadmap, articles, tools. Hash-routed views. */
:root{
  --bg:#F2F4FF; --surface:#FFFFFF; --surface2:#E7EAFB; --fg:#14123A; --muted:#55587E; --line:#D5D9F2;
  --accent:#E3235F; --accent-fg:#FFFFFF; --hi:#FFC93C; --hi-fg:#201700; --cell:#D5D9F2;
  --c-pink:#E3235F; --c-orange:#F5822A; --c-blue:#2F7BFF; --c-mint:#12B886; --c-violet:#7C4DFF;
  --display:"Unbounded","Arial Black",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F2B; --surface:#1B1941; --surface2:#262355; --fg:#F4F3FF; --muted:#ABA8D8; --line:#34306E;
  --accent:#FF5C86; --accent-fg:#2A0212; --hi:#FFD24D; --hi-fg:#201700; --cell:#34306E;
  --c-pink:#FF5C86; --c-orange:#FFA040; --c-blue:#5AA8FF; --c-mint:#34E0A8; --c-violet:#A58BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F2B; --surface:#1B1941; --surface2:#262355; --fg:#F4F3FF; --muted:#ABA8D8; --line:#34306E;
  --accent:#FF5C86; --accent-fg:#2A0212; --hi:#FFD24D; --hi-fg:#201700; --cell:#34306E;
  --c-pink:#FF5C86; --c-orange:#FFA040; --c-blue:#5AA8FF; --c-mint:#34E0A8; --c-violet:#A58BFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:radial-gradient(560px 340px at 100% 0,color-mix(in srgb,var(--c-pink) 22%,transparent),transparent),radial-gradient(520px 360px at 0 28%,color-mix(in srgb,var(--c-blue) 18%,transparent),transparent),radial-gradient(520px 320px at 100% 70%,color-mix(in srgb,var(--c-mint) 14%,transparent),transparent);background-repeat:no-repeat;color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;letter-spacing:-.02em;text-wrap:balance;margin:0}
h2{font-size:clamp(1.35rem,4.5vw,1.9rem);font-weight:800}
h3{font-size:1.05rem;font-weight:800;line-height:1.3}
p{margin:0;max-width:65ch}
.kicker{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.meta{font-family:var(--mono);font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hl{background:var(--hi);color:var(--hi-fg);padding:0 .22em;border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* header */
header.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;letter-spacing:-.03em}
.logo svg{flex:none}
nav{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}
nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--muted);padding:7px 12px;border-radius:99px;transition:background .15s,color .15s}
nav a:hover{color:var(--fg);background:var(--surface2)}
nav a[aria-current="page"]{background:linear-gradient(135deg,#E3235F,#F2572B);color:#fff}

/* hero */
.hero{display:flex;flex-direction:column;gap:22px}
.hero h1{display:flex;flex-direction:column;gap:6px;font-weight:800}
.hero .big{font-size:clamp(5.2rem,27vw,12.5rem);line-height:.82;letter-spacing:-.07em;color:var(--c-pink);background:linear-gradient(90deg,var(--c-pink),var(--c-orange),var(--hi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:block;padding-bottom:.06em}
.hero .sm{font-size:clamp(1.25rem,5vw,2.1rem);display:block;line-height:1.15;max-width:18ch;font-weight:800}
.lead{font-size:1.15rem;color:var(--muted);max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#E3235F,#F2572B);color:#fff;font-weight:600;font-family:var(--body);font-size:1rem;padding:13px 22px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:9px}

/* counter */
.counter{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:18px}
.count-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.num{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.num span{color:var(--muted);font-size:.45em;letter-spacing:0;font-weight:500}
.pct{font-family:var(--mono);font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.grid i{aspect-ratio:1;border-radius:3px;background:var(--cell);display:block}
.grid i.ms{background:var(--muted);opacity:.55}
.grid i.ms.on{opacity:1}
.grid i.on{background:var(--c-pink);box-shadow:none}
.grid i.on:nth-child(5n+2){background:var(--c-orange)}
.grid i.on:nth-child(5n+3){background:var(--hi)}
.grid i.on:nth-child(5n+4){background:var(--c-mint)}
.grid i.on:nth-child(5n+5){background:var(--c-blue)}
.grid.full i{background:var(--hi)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1 1 100%;order:-1;accent-color:var(--accent);margin:4px 0 8px}
.stepbtn{font-family:var(--mono);font-weight:500;font-size:.9rem;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.stepbtn:hover{border-color:var(--fg)}
.next{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.next b{font-weight:600}
.msg{font-weight:600}
.ms-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.got{background:var(--hi);border-color:var(--hi);color:var(--hi-fg)}

/* sections */
.sec{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0;transition:transform .18s,border-color .18s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card p{color:var(--muted);font-size:.97rem}
.card .range{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.04em;color:var(--pcs,var(--accent));line-height:1}
.bar{height:6px;background:var(--cell);border-radius:9px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--pcs,var(--accent));border-radius:9px;transition:width .3s}

/* article list */
.list{display:flex;flex-direction:column}
.list a.item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center;padding:22px 0;border-top:1px solid var(--line);text-decoration:none}
.list a.item:last-child{border-bottom:1px solid var(--line)}
.list .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.2rem;line-height:1.2}
.list .t{min-width:0}
.list .t p{color:var(--muted);margin-top:6px;font-size:.97rem}
.list .arrow{font-size:1.4rem;color:var(--muted);transition:transform .15s,color .15s}
.list a.item:hover .arrow{transform:translateX(5px);color:var(--accent)}
.list a.item:hover h3{color:var(--accent)}
.tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font-family:var(--body);font-weight:600;font-size:.92rem;padding:8px 15px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* article view */
.article{display:flex;flex-direction:column;gap:22px;max-width:700px}
.article h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800}
.article h2{font-size:clamp(1.15rem,4vw,1.45rem);margin-top:12px}
.article ul,.article ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:9px;max-width:65ch}
.article li::marker{color:var(--accent);font-weight:700}
.article .intro{font-size:1.2rem;color:var(--muted)}
.back{font-size:.95rem;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--fg)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:12px;padding:16px 18px;max-width:65ch}
.note b{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:4px;color:var(--muted)}
.check{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.check h3{margin-bottom:6px}
.check label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:5px 0}
.check input{margin-top:.32em;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.more{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:24px}
.more a{text-decoration:none}
.more a:hover h3{color:var(--accent)}

/* tools */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:20px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.field small{color:var(--muted);font-size:.84rem;line-height:1.4}
.field input[type=number]{font-family:var(--mono);font-size:1.1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.result{background:var(--surface2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.result .big2{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);letter-spacing:-.03em;line-height:1.15}

/* faq */
details{border-top:1px solid var(--line);padding:16px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:10px;color:var(--muted)}

.field input[type=text],.field input[type=password]{font-family:var(--body);font-size:1.05rem;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.field input:focus-visible{outline-offset:1px}
.auth{max-width:480px;display:flex;flex-direction:column;gap:20px}
.auth form{display:flex;flex-direction:column;gap:16px}
.err{color:var(--accent);font-weight:600;min-height:1.4em;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:-.04em;line-height:1}
.btn.danger{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.field textarea{font-family:var(--body);font-size:1.05rem;line-height:1.5;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%;resize:vertical}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.arow label{display:flex;gap:10px;align-items:center;min-width:0;flex:1;cursor:pointer}
.arow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.arow .txt{overflow-wrap:anywhere;min-width:0}
.arow input:checked+.txt{text-decoration:line-through;color:var(--muted)}
.gate{display:flex;flex-direction:column;gap:22px;max-width:520px;padding-top:24px}
.gate h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800}
.gate h1 em{font-style:normal;color:var(--accent)}
.btn.big{padding:16px 28px;font-size:1.1rem;border-radius:14px}
.gate .cta .btn{flex:1 1 200px;justify-content:center}
.tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--tc,var(--accent))}
.tile svg,.abanner svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile svg{width:28px;height:28px}
.cat-Contenu{--tc:linear-gradient(135deg,#2F7BFF,#7C4DFF)}
.cat-Croissance{--tc:linear-gradient(135deg,#12B886,#2F7BFF)}
.cat-Mental{--tc:linear-gradient(135deg,#E3235F,#F5822A)}
.ph1{--pc:linear-gradient(135deg,#E3235F,#F5822A);--pcs:var(--c-pink)}
.ph2{--pc:linear-gradient(135deg,#2F7BFF,#7C4DFF);--pcs:var(--c-blue)}
.ph3{--pc:linear-gradient(135deg,#12B886,#2F7BFF);--pcs:var(--c-mint)}
.ph4{--pc:linear-gradient(135deg,#F5822A,#FFC93C);--pcs:var(--c-orange)}
.card[class*=" ph"]{border-top:5px solid var(--pcs)}
.abanner{position:relative;overflow:hidden;height:130px;border-radius:22px;background:var(--tc);display:flex;align-items:center;gap:16px;padding:0 26px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem}
.abanner svg{width:58px;height:58px;stroke-width:1.8;flex:none;position:relative}
.abanner span{position:relative}
.abanner::before,.abanner::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.15}
.abanner::before{width:170px;height:170px;right:-30px;top:-60px}
.abanner::after{width:90px;height:90px;right:90px;bottom:-45px}
.art{width:100%;height:auto;display:block;border-radius:24px}
.hero .art{max-width:520px}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none;transform:none}
.price{display:flex;flex-direction:column;gap:18px;background:linear-gradient(135deg,#E3235F,#F5822A 60%,#FFC93C);color:#fff;border-radius:22px;padding:26px}
.price .num{color:#fff}
.price .num span{color:#fff;opacity:.85}
.price ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.price .btn{background:#fff;color:#C2154B;align-self:flex-start}
.price small{opacity:.9;line-height:1.4}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:2px;flex-wrap:nowrap;justify-content:space-between}
nav.tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:.72rem;font-weight:600;color:var(--muted);background:none}
nav.tabbar a:hover{background:none;color:var(--fg)}
nav.tabbar a[aria-current="page"]{background:none;color:var(--accent)}
nav.tabbar a[aria-current="page"] .ti{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tabbar .ti{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .15s}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flinks{display:flex;gap:16px;flex-wrap:wrap}
.flinks a{color:var(--muted);font-weight:600;text-decoration:none}
.flinks a:hover{color:var(--fg)}
.stepbtn,.filters button{min-height:44px}
.stepbtn{min-width:52px}
.check label{padding:9px 0}
.check input{width:22px;height:22px}
.btn.small{min-height:44px}
@media (max-width:700px){
  header.top nav{display:none}
  .tabbar{display:flex}
  body{padding-block-end:calc(96px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:44px}
}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--fg)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hist{width:100%;height:auto;display:block}
.g-t{font:10px var(--mono);fill:var(--muted)}
.g-base{stroke:var(--line);stroke-width:1}
.g-goal{stroke:var(--hi);stroke-width:1.5;stroke-dasharray:4 4}
.g-area{fill:color-mix(in srgb,var(--c-pink) 18%,transparent)}
.g-line{fill:none;stroke:var(--c-pink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-dot{fill:var(--c-pink);stroke:var(--surface);stroke-width:2}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.news{display:flex;flex-direction:column;gap:14px;background:linear-gradient(135deg,#0FA678,#2F7BFF);color:#fff;border-radius:22px;padding:24px}
.news h2{font-size:1.4rem}
.news p{opacity:.95}
.news .btn{background:#fff;color:#0B5FD6;align-self:flex-start}
.news small{opacity:.9}
.maint{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#D9480F,#E8890C);color:#fff;border-radius:14px;padding:12px 14px 12px 16px;font-weight:600;line-height:1.4}
.maint.vt{background:linear-gradient(135deg,#5B21B6,#7C3AED)}

@keyframes ms-glow{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
@keyframes ms-pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(255,255,255,.15))}50%{transform:scale(1.06);filter:drop-shadow(0 0 28px rgba(255,255,255,.45))}}
@keyframes alert-border{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}40%{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 24px rgba(255,255,255,.2)}55%{box-shadow:0 0 0 4px rgba(255,255,255,.15)}}
@keyframes high-shimmer{0%{background-position:0% 50%}100%{background-position:100% 50%}}
/* Éclairs — flash blanc bref qui fait vraiment "orage" */
@keyframes lightning-flash{
  0%,88%,100%{opacity:0}
  89%{opacity:.0}
  90%{opacity:.85}
  91%{opacity:.15}
  92.5%{opacity:.95}
  93.5%{opacity:.2}
  95%{opacity:.55}
  96.5%{opacity:0}
}
@keyframes storm-shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-1px,1px)}
  40%{transform:translate(1px,-1px)}
  60%{transform:translate(-1px,0)}
  80%{transform:translate(1px,1px)}
}
@keyframes bolt-crack{
  0%,100%{opacity:0;transform:scaleY(.3) translateY(-20%)}
  8%{opacity:1;transform:scaleY(1) translateY(0)}
  14%{opacity:.3}
  18%{opacity:.9}
  24%{opacity:0;transform:scaleY(.6) translateY(10%)}
}
@keyframes cloud-drift{
  0%{transform:translateX(-3%) scale(1)}
  50%{transform:translateX(3%) scale(1.04)}
  100%{transform:translateX(-3%) scale(1)}
}
@keyframes red-pulse-bg{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.12)}
}
/* Mode site entier — orage / éclairs WOW */
/* Overlay orage — pluie + éclairs (visible) */
#storm-fx{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
#storm-fx .dim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
#storm-fx.bk .dim{background:rgba(0,0,0,.45)}
#storm-fx .flash{position:absolute;inset:0;opacity:0;background:#fff}
#storm-fx .bolt-layer{position:absolute;inset:0}
#storm-fx .rain{position:absolute;inset:-5% 0 0 0;transform:rotate(8deg);transform-origin:center top}
#storm-fx .drop{position:absolute;top:-10%;width:2px;height:18px;
  background:linear-gradient(180deg,rgba,rgba(255,255,255,.55));
  border-radius:1px;animation:rain-fall linear infinite;will-change:transform}
#storm-fx.bk .drop{width:2.5px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.7))}
#storm-fx .bolt{position:absolute;top:0;opacity:0;pointer-events:none}
#storm-fx .bolt svg{display:block;overflow:visible;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(180,210,255,.95)) drop-shadow(0 0 30px rgba(120,160,255,.8))}
#storm-fx.rd .bolt svg{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(255,160,160,.95)) drop-shadow(0 0 30px rgba(255,60,60,.85))}
#storm-fx.or .bolt svg{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(255,200,140,.95)) drop-shadow(0 0 30px rgba(255,120,30,.8))}
#storm-fx.vt .bolt svg{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(200,170,255,.95)) drop-shadow(0 0 30px rgba(140,90,255,.85))}
#storm-fx.bk .bolt svg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 18px #fff) drop-shadow(0 0 40px rgba(200,210,255,.9))}
#storm-fx.boom .flash{animation:storm-flash-hit .32s steps(2,end) 1}
#storm-fx.boom .bolt.main{animation:storm-bolt-hit .36s ease-out 1}
#storm-fx.boom .bolt.branch{animation:storm-bolt-hit .3s ease-out .05s 1}
@keyframes rain-fall{
  0%{transform:translateY(0)}
  100%{transform:translateY(120vh)}
}
@keyframes storm-flash-hit{
  0%{opacity:0}
  10%{opacity:.85}
  25%{opacity:.1}
  40%{opacity:1}
  55%{opacity:.2}
  70%{opacity:.45}
  100%{opacity:0}
}
@keyframes storm-bolt-hit{
  0%{opacity:0}
  5%{opacity:1}
  25%{opacity:.35}
  40%{opacity:1}
  100%{opacity:0}
}
@media (prefers-reduced-motion:reduce){
  #storm-fx{display:none!important}
}

var ARTICLES=[
{id:"premiere-video",cat:"Contenu",t:"Ta première vidéo : courte, terminée, publiée",d:"Pourquoi une vidéo finie vaut mieux qu'une vidéo parfaite, et comment la sortir en un week-end.",m:"6 min",
intro:"La plupart des chaînes s'arrêtent avant la dixième vidéo. Pas par manque de talent. La première vidéo a pris trois semaines, personne ne l'a vue, et l'envie est partie. Voici comment éviter ça.",
body:[
["h2","Une idée qui tient en une phrase"],
["p","Avant de filmer, complète cette phrase : « Dans cette vidéo, je montre à [qui] comment [faire quoi] en [combien de temps]. » Si tu n'y arrives pas, l'idée est trop floue. Rétrécis-la jusqu'à ce que la phrase sorte toute seule."],
["h2","Le matériel minimum"],
["ul",["Ton téléphone, posé contre quelque chose de stable, en horizontal.","La lumière d'une fenêtre devant toi. Jamais derrière.","Un son propre. Rapproche-toi du micro du téléphone ou utilise des écouteurs avec micro. Les gens pardonnent une image moyenne, rarement un son mauvais.","Un logiciel de montage gratuit. Le plus simple que tu trouves suffit."]],
["h2","La structure qui évite de se perdre"],
["ol",["Le résultat promis, en une phrase (0 à 15 secondes).","Une courte preuve ou un exemple pour donner envie de rester.","Le contenu, découpé en 3 parties maximum.","Une conclusion qui rappelle ce que la personne sait faire maintenant.","Une seule invitation à s'abonner, quand tu as déjà apporté quelque chose."]],
["h2","Le piège du perfectionnisme"],
["p","Ta première vidéo ne sera pas bonne selon tes critères d'aujourd'hui. Elle le sera encore moins selon ceux que tu auras dans six mois. Ce n'est pas un problème : elle sert à apprendre le tournage, le montage, la publication. Les trois seules choses que personne ne t'apprend à l'avance."],
["note","Règle du week-end","Samedi : tourner. Dimanche : monter et publier. Pas de troisième jour. Ce que tu n'as pas pu corriger en un week-end, tu le corrigeras sur la vidéo suivante."],
["check","premiere",["J'ai écrit ma phrase « dans cette vidéo… »","J'ai tourné avec une bonne lumière et un son propre","J'ai coupé les silences du début et de la fin","J'ai choisi un titre et une miniature lisibles","J'ai publié, sans attendre d'être prêt à 100 %"]]
]},
{id:"30-premiers-abonnes",cat:"Croissance",t:"Les 30 premiers abonnés : où les trouver",d:"Au début, ils viennent de toi, pas de l'algorithme. Cinq endroits où aller les chercher.",m:"7 min",
intro:"Au départ, YouTube ne sait pas encore à qui montrer tes vidéos. Les premiers abonnés viennent donc de ce que tu fais toi-même. C'est la phase la plus lente, et la plus importante.",
body:[
["h2","1. Ton entourage, avec un vrai message"],
["p","Ne poste pas un lien collectif en story. Écris à dix personnes, une par une, en leur disant pourquoi tu penses que ça peut leur plaire. Demande-leur un avis honnête. Ceux qui répondent deviennent souvent les premiers abonnés fidèles."],
["h2","2. Les communautés de ton sujet"],
["p","Discord, Reddit, groupes, forums. Participe pendant deux semaines avant de partager quoi que ce soit : réponds aux questions, donne des conseils. Quand tu partages une vidéo, qu'elle réponde à une question vraiment posée dans la communauté."],
["h2","3. Les commentaires chez les autres"],
["p","Les spectateurs des chaînes proches de la tienne aiment déjà ton sujet. Écris des commentaires utiles, avec une vraie idée ou une vraie question. « Abonne-toi à moi » est supprimé et mal vu. Un bon commentaire donne envie de cliquer sur ton nom."],
["h2","4. Tes vidéos, bien rangées"],
["p","Une playlist claire, une bannière qui dit de quoi parle la chaîne, une vidéo épinglée qui présente ton meilleur contenu. Quelqu'un qui arrive sur ta chaîne doit comprendre en cinq secondes ce qu'il va y trouver."],
["h2","5. Tes spectateurs actuels"],
["p","Demande-leur ce qu'ils voudraient voir. Réponds à tous les commentaires. Les gens s'abonnent à quelqu'un qui les écoute."],
["h2","Ce qui ne marche pas"],
["p","Les échanges d'abonnements (« sub4sub ») donnent des chiffres sans spectateurs. Ces comptes ne regardent pas tes vidéos, ce qui peut gêner leur diffusion ensuite. Un abonné qui regarde vaut plus que vingt qui ne regardent pas."],
["note","Garde un carnet","Pour chaque nouvel abonné que tu identifies, note d'où il vient. Après un mois, tu sauras quel canal marche pour toi et tu pourras y mettre ton énergie."],
["check","abonnes",["J'ai écrit à 10 personnes une par une","Je suis actif dans 2 communautés de mon sujet","J'ai laissé 10 commentaires utiles chez d'autres chaînes","Ma bannière et ma vidéo épinglée expliquent ma chaîne","J'ai répondu à tous mes commentaires cette semaine"]]
]},
{id:"niche",cat:"Croissance",t:"Choisir un sujet précis qui te ressemble",d:"Une chaîne sur « tout » n'attire personne. Comment trouver ton angle.",m:"6 min",
intro:"Quand tout le monde peut être ton public, personne ne se sent visé. Un sujet précis aide les gens à se dire « cette chaîne est pour moi ».",
body:[
["h2","Trois questions pour trouver ton angle"],
["ol",["De quoi puis-je parler pendant 50 vidéos sans m'ennuyer ?","Qu'est-ce que je sais faire que je pourrais expliquer à quelqu'un qui débute ?","Qui regarde déjà des vidéos sur ce sujet, et que manque-t-il dans ce qu'il trouve ?"]],
["h2","Rétrécis jusqu'à ce que ça pique un peu"],
["p","« Jeux vidéo » est trop large. « Jeux de survie sur console, pour les joueurs qui débutent » est un public. Tu pourras toujours élargir plus tard, quand une communauté te suivra. L'inverse est beaucoup plus dur."],
["h2","Teste avant de t'engager"],
["p","Fais trois vidéos sur ton sujet. Regarde laquelle est la plus regardée jusqu'au bout, laquelle reçoit le plus de commentaires, laquelle tu as le plus aimé faire. Le bon sujet est souvent à l'intersection des trois."],
["h2","Ta personnalité fait partie du sujet"],
["p","Sur un sujet que mille chaînes traitent déjà, ce qui te différencie, c'est ta façon d'en parler. Ton humour, ta méthode, ton regard de débutant ou d'expert. Ne le cache pas."],
["note","Exercice","Écris sur une feuille : « Ma chaîne aide [qui] à [quoi]. » Montre-la à trois personnes. Si l'une dit « ah oui, ça m'intéresse », tu es sur la bonne voie."]
]},
{id:"titres-miniatures",cat:"Contenu",t:"Titres et miniatures : ce qui fait cliquer",d:"Une bonne vidéo avec une mauvaise miniature reste invisible. Les règles simples à appliquer.",m:"6 min",
intro:"La miniature et le titre décident si quelqu'un ouvre ta vidéo. Tu peux avoir un excellent contenu : sans clic, personne ne le voit.",
body:[
["h2","La miniature"],
["ul",["Un seul sujet clair, lisible sur un écran de téléphone.","Trois ou quatre mots maximum, en gros caractères.","Un fort contraste entre le sujet et le fond.","Un visage ou une émotion quand c'est pertinent. Les gens réagissent aux visages.","Pas de détails fins. Teste en la réduisant à la taille d'un timbre."]],
["h2","Le titre"],
["ul",["Dis ce que la personne va obtenir ou apprendre.","Place les mots importants au début.","Complète la miniature au lieu de la répéter.","Reste honnête. Si le titre promet ce que la vidéo ne donne pas, les gens partent vite, ce qui pénalise la vidéo."]],
["h2","Le duo miniature + titre"],
["p","Les deux doivent raconter ensemble une petite histoire ou poser une question. La miniature montre l'émotion ou le résultat, le titre donne le contexte. Évite que les deux disent exactement la même chose."],
["h2","Étudie ce qui marche"],
["p","Regarde cinq vidéos sur ton sujet qui ont beaucoup plus de vues que les tiennes. Note les mots, les couleurs, la composition. Tu ne copies pas : tu repères les habitudes de ton public."],
["note","Test simple","Montre ta miniature à quelqu'un pendant deux secondes, puis cache-la. S'il ne peut pas te dire de quoi parle la vidéo, simplifie."],
["check","miniature",["Ma miniature est lisible sur un écran de téléphone","Elle contient 4 mots ou moins","Mon titre annonce clairement ce que la personne va obtenir","Titre et miniature ne disent pas la même chose","Ils décrivent honnêtement ma vidéo"]]
]},
{id:"retention",cat:"Contenu",t:"Garder les gens jusqu'à la fin de la vidéo",d:"Hook, rythme, coupes : comment éviter que les spectateurs partent à 20 secondes.",m:"7 min",
intro:"Un spectateur qui part au bout de quinze secondes dit à YouTube que la vidéo ne l'a pas retenu. La durée de visionnage est l'un des signaux qui comptent le plus. Voici comment la travailler.",
body:[
["h2","Les 30 premières secondes"],
["ol",["Annonce tout de suite ce que la personne va obtenir.","Donne un aperçu du résultat ou de la meilleure partie.","Entre dans le sujet. Pas de longue présentation de toi avant d'avoir apporté quelque chose."]],
["h2","Le rythme"],
["ul",["Coupe les silences, les hésitations, les répétitions.","Change quelque chose toutes les 5 à 10 secondes : un plan, un zoom, un texte, une image.","Une phrase qui n'apporte rien doit disparaître.","Annonce ce qui vient : « Dans deux minutes, je te montre l'erreur la plus courante »."]],
["h2","Lire tes statistiques"],
["p","Dans YouTube Studio, ouvre la courbe de rétention d'une de tes vidéos. Cherche les chutes brutales. Regarde ce que tu disais ou montrais à ces moments. Tu verras vite ce qui fait partir les gens : une intro trop longue, une explication confuse, un passage répétitif."],
["h2","Une durée adaptée au contenu"],
["p","Une vidéo n'a pas besoin d'être longue. Elle doit être aussi courte que possible pour tenir sa promesse. Huit minutes qui retiennent les gens valent mieux que quinze qui les perdent."],
["note","À faire cette semaine","Prends ta dernière vidéo. Note à quel moment la courbe chute le plus. Réécris ce passage comme si tu devais le refaire demain."]
]},
{id:"regularite",cat:"Mental",t:"Un rythme de publication que tu peux tenir",d:"Mieux vaut une vidéo toutes les deux semaines pendant un an que dix en un mois puis plus rien.",m:"5 min",
intro:"Poster tous les jours pendant dix jours puis disparaître ne construit rien. Une chaîne grandit quand les gens savent qu'elle continue.",
body:[
["h2","Trouve ton vrai rythme"],
["ol",["Chronomètre le temps qu'une vidéo prend du début à la fin : idée, tournage, montage, miniature, publication.","Ajoute la moitié de ce temps pour les semaines où rien ne se passe comme prévu.","Divise ton temps libre réel par ce chiffre. C'est ton rythme."]],
["h2","Bloque des créneaux"],
["p","Deux créneaux fixes par semaine. Un pour filmer, un pour monter. Traite-les comme des rendez-vous. Ce qui n'a pas de place dans l'agenda n'arrive pas."],
["h2","Garde de l'avance"],
["p","Quand tu as de l'élan, filme une vidéo de plus que prévu et garde-la. Les semaines creuses seront moins stressantes, et ton jour de publication restera stable."],
["h2","Annonce ton rythme"],
["p","Dis-le dans ta description de chaîne et dans tes vidéos : « Nouvelle vidéo chaque samedi. » Tu t'engages devant quelqu'un, et tes spectateurs savent quand revenir."],
["note","Si tu dois ralentir","Ralentir est permis. Disparaître sans prévenir ne l'est pas. Dis à ta communauté que tu passes à une vidéo toutes les deux semaines, et pourquoi. Les gens comprennent mieux que tu ne le crois."]
]},
{id:"tenir",cat:"Mental",t:"Ne pas abandonner quand les vues sont faibles",d:"Se comparer, douter, avoir 12 vues : ce que ça veut dire, et comment continuer.",m:"6 min",
intro:"Tu publies, tu attends, et la vidéo a 12 vues dont 4 sont les tiennes. C'est le moment où beaucoup arrêtent. Ce qui suit aide à tenir.",
body:[
["h2","Les petits chiffres sont normaux"],
["p","Toutes les grandes chaînes ont commencé avec presque personne. Ce que tu vois chez les autres, c'est leur résultat, pas leur début. Compare-toi à toi il y a trois mois, pas à quelqu'un qui a cinq ans d'avance."],
["h2","Change de question"],
["p","« Pourquoi personne ne regarde ? » mène nulle part. Demande plutôt : « Qu'est-ce que je peux améliorer dans la prochaine vidéo ? » Une vidéo, un seul changement : le titre, la miniature, les 30 premières secondes. Observe."],
["h2","Mesure ce que tu contrôles"],
["ul",["Le nombre de vidéos publiées ce mois-ci.","Le nombre de commentaires auxquels tu as répondu.","Le nombre de choses que tu as essayées de nouveau.","Pas le nombre de vues, qui dépend aussi d'autres choses."]],
["h2","Entoure-toi"],
["p","Trouve une ou deux personnes qui font aussi une petite chaîne. Partagez vos vidéos, vos doutes, vos progrès. Le soutien de quelqu'un qui comprend change beaucoup."],
["h2","Célèbre les petites étapes"],
["p","Premier commentaire, premier abonné, première vidéo à 100 vues. Note-les. Quand ça devient dur, relis ta liste."],
["note","Si ça devient trop lourd","Faire une pause pour souffler est une décision, pas un échec. Reviens quand l'envie est de retour, avec ce que tu as appris."]
]}
];

var FAQ=[
["Combien de temps faut-il pour atteindre 200 abonnés ?","Ça dépend de ton sujet, de ton rythme et de ce que tu fais pour faire connaître la chaîne. Certains y arrivent en quelques semaines, d'autres en plusieurs mois. L'outil de calcul de ce blog te donne une estimation à partir de tes propres chiffres."],
["Faut-il acheter du matériel pour commencer ?","Non. Un téléphone, une bonne lumière et un son propre suffisent pour les premières vidéos. Investis plus tard, quand tu sais ce dont tu as besoin."],
["Les Shorts aident-ils à gagner des abonnés ?","Ils peuvent faire connaître la chaîne à plus de monde, mais les spectateurs qui arrivent par là ne regardent pas toujours tes vidéos longues. Teste, observe tes statistiques, et garde ce qui t'amène des spectateurs fidèles."],
["Faut-il montrer son visage ?","Non. Beaucoup de chaînes marchent avec la voix, l'écran ou des images. L'essentiel est d'avoir un style reconnaissable et de donner quelque chose d'utile ou de divertissant."],
["Que faire si je suis bloqué à 150 ?","Retourne voir ta courbe de rétention et tes miniatures. Refais ta meilleure vidéo en version améliorée, et demande à tes spectateurs ce qui leur manque."]

function stormBoltSVG(w,h,seed){
  var d=stormPath(w,h,seed);
  var d2=stormPath(w,h*0.7,seed+3);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+d+'" fill="none" stroke="rgba(220,235,255,.9)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+d+'" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+d2+'" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate('+(w*0.15).toFixed(0)+' '+(h*0.12).toFixed(0)+') scale(0.7)"/>'+
    '</svg>';

function stormStrike(root){
  if(!root||!document.body.contains(root))return;
  var layer=root.querySelector(".bolt-layer");
  if(!layer)return;
  var H=Math.max(window.innerHeight||700,500);
  var seed=Math.floor(Math.random()*9999);
  var left=5+Math.random()*75;
  var bw=48+Math.floor(Math.random()*40);
  var bh=Math.floor(H*(0.5+Math.random()*0.4));
  var html='<span class="bolt main" style="left:'+left.toFixed(1)+'%;width:'+bw+'px;height:'+bh+'px">'+stormBoltSVG(bw,bh,seed)+'</span>';
  if(Math.random()>0.35){
    var left2=Math.max(3,Math.min(88,left+(Math.random()>0.5?20:-20)));
    var bw2=32+Math.floor(Math.random()*28);
    var bh2=Math.floor(bh*(0.5+Math.random()*0.35));
    html+='<span class="bolt branch" style="left:'+left2.toFixed(1)+'%;width:'+bw2+'px;height:'+bh2+'px;top:6%">'+stormBoltSVG(bw2,bh2,seed+11)+'</span>';
  }
  layer.innerHTML=html;
  root.classList.remove("boom");

  root.classList.add("boom");
  setTimeout(function(){if(root&&root.classList)root.classList.remove("boom");if(layer)layer.innerHTML=""},400);
}
function stormSchedule(root,lvl){

  var base=lvl==="bk"?1200:lvl==="rd"?1600:lvl==="vt"?2100:2800;
  __stormT=setTimeout(function(){
    stormStrike(root);
    if(Math.random()>0.55)setTimeout(function(){stormStrike(root)},100+Math.random()*160);
    stormSchedule(root,lvl);
  },base+Math.random()*base);
}
function stormBuildRain(el,lvl){
  if(__stormRainBuilt===lvl&&el.querySelector(".drop"))return;
  __stormRainBuilt=lvl;
  var rain=el.querySelector(".rain");if(!rain)return;

function stormSync(lvl){
  var high=lvl==="bk"||lvl==="vt"||lvl==="rd"||lvl==="or";
  if(!high){stormStop();return}
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){stormStop();return}
  var el=document.getElementById("storm-fx");
  var needStart=!el||!__stormT||(el.className!==lvl);
  if(!el){
    el=document.createElement("div");
    el.id="storm-fx";
    el.setAttribute("aria-hidden","true");
    el.innerHTML='<div class="dim"></div><i class="flash"></i><div class="bolt-layer"></div><div class="rain"></div>';
    document.body.appendChild(el);
  }
  el.className=lvl;

  if(needStart){

/* ---------- COMPTE PAR E-MAIL, SYNCHRONISÉ (Supabase, actif quand l'URL et la clé sont remplies) ---------- */
var SB_URL="";
var SB_KEY="";
function sbOn(){return !!(SB_URL&&SB_KEY)}
var emailState={step:"ask",email:""};
function sbH(tok){return {"apikey":SB_KEY,"Content-Type":"application/json","Authorization":"Bearer "+(tok||SB_KEY)}}
function sbCall(method,path,body,tok,extra){
  var h=sbH(tok);if(extra)for(var k in extra)h[k]=extra[k];
  return fetch(SB_URL+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw {status:r.status,body:j};return j})});
}
function saveSess(x){try{localStorage.setItem("vx-session",JSON.stringify(x))}catch(e){}}
function ensureToken(){
  var s=curSession();if(!s||!s.t)return Promise.resolve(null);
  if(s.x-Date.now()>60000)return Promise.resolve(s);
  return sbCall("POST","/auth/v1/token?grant_type=refresh_token",{refresh_token:s.r}).then(function(r){
    s.t=r.access_token;s.r=r.refresh_token;s.x=Date.now()+(r.expires_in||3600)*1000;saveSess(s);return s}).catch(function(){return null});
}
function pullProgress(s){
  return sbCall("GET","/rest/v1/progress?select=data&user_id=eq."+s.id,null,s.t).then(function(rows){
    if(!rows||!rows.length)return null;
    var d=rows[0].data||{};
    try{
      localStorage.setItem("vx-count@"+s.u,JSON.stringify(d.count||0));
      localStorage.setItem("vx-plan@"+s.u,JSON.stringify(d.plan||{}));
      localStorage.setItem("vx-chk@"+s.u,JSON.stringify(d.chk||{}));
      localStorage.setItem("vx-premium@"+s.u,JSON.stringify(d.premium===true));
    }catch(e){}
    return d;
  });
}
var pushT=null;
function schedulePush(){var s=curSession();if(!s||!s.t)return;clearTimeout(pushT);pushT=setTimeout(pushNow,900)}
function pushNow(){
  ensureToken().then(function(s){
    if(!s)return;
    var data={count:getCount(),plan:ls("vx-plan",{}),chk:ls("vx-chk",{}),premium:ls("vx-premium",false)===true};
    return sbCall("POST","/rest/v1/progress?on_conflict=user_id",{user_id:s.id,data:data,updated_at:new Date().toISOString()},s.t,{"Prefer":"resolution=merge-duplicates"});
  }).catch(function(){});
}
function syncOnLoad(){
  var s=curSession();if(!sbOn()||!s||!s.t)return;
  ensureToken().then(function(se){if(!se)return;return pullProgress(se)}).then(function(d){if(d&&!welcome&&location.hash.indexOf("#admin")!==0)route()}).catch(function(){});
}
function sbErr(e,verify){
  var b=e&&e.body||{},c=b.error_code||b.code||"";
  if((e&&e.status===429)||c==="over_email_send_rate_limit"||c==="over_request_rate_limit")return "Trop d'e-mails envoyés pour le moment. Attends quelques minutes puis réessaie.";
  if(verify)return "Code incorrect ou expiré. Vérifie-le ou demande un nouveau code.";
  if(c==="email_address_invalid")return "Cette adresse e-mail n'est pas acceptée.";
  return "Impossible d'envoyer le code pour le moment. Réessaie plus tard.";
}

  var logo='<span class="kicker">Blog de vxnshii</span>';

  return '<div class="gate auth">'+logo+'<h1>Ton compte <em>partout</em></h1><p class="lead" style="font-size:1.05rem">Entre ton e-mail. On t\'envoie un code, sans mot de passe. Ton compte et ta progression te suivent sur tous tes appareils.</p>'+

function sendCode(email){return sbCall("POST","/auth/v1/otp",{email:email,create_user:true})}
function verifyCode(email,code){
  return sbCall("POST","/auth/v1/verify",{type:"email",email:email,token:code}).catch(function(e){
    if(e&&e.status&&e.status<500&&e.status!==429)return sbCall("POST","/auth/v1/verify",{type:"signup",email:email,token:code});
    throw e});
}
function initEmail(){
  var f=document.getElementById("e-form");if(!f)return;
  var err=document.getElementById("e-err"),go=document.getElementById("e-go");
  var ch=document.getElementById("e-change");
  if(ch)ch.addEventListener("click",function(){emailState={step:"ask",email:""};route()});
  var rs=document.getElementById("e-resend");
  if(rs)rs.addEventListener("click",function(){
    err.textContent="";rs.disabled=true;
    sendCode(emailState.email).then(function(){err.style.color="var(--fg)";err.textContent="Nouveau code envoyé."}).catch(function(e){err.style.color="";err.textContent=sbErr(e,false)}).then(function(){setTimeout(function(){rs.disabled=false},20000)});
  });
  f.addEventListener("submit",function(e){
    e.preventDefault();err.style.color="";err.textContent="";
    if(emailState.step==="ask"){
      var em=document.getElementById("e-mail").value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){err.textContent="Entre une adresse e-mail valide.";return}
      go.disabled=true;
      sendCode(em).then(function(){emailState={step:"code",email:em};route()}).catch(function(x){err.textContent=sbErr(x,false);go.disabled=false});
    }else{
      var code=document.getElementById("e-code").value.replace(/\s/g,"");
      if(!/^\d{4,8}$/.test(code)){err.textContent="Le code contient des chiffres uniquement.";return}
      go.disabled=true;
      verifyCode(emailState.email,code).then(function(res){
        var u=res.user,sess={u:"e-"+u.id,n:(u.email||emailState.email).split("@")[0]||"toi",id:u.id,em:u.email||emailState.email,t:res.access_token,r:res.refresh_token,x:Date.now()+(res.expires_in||3600)*1000};
        return pullProgress(sess).then(function(d){
          var isNew=!d;
          saveSess(sess);
          if(isNew){try{["vx-count","vx-plan","vx-chk","vx-premium"].forEach(function(k){localStorage.removeItem(k+"@"+sess.u)})}catch(x){}pushNow()}
          emailState={step:"ask",email:""};
          welcome={n:sess.n,m:isNew?"signup":"login"};route();
        });
      }).catch(function(x){err.textContent=sbErr(x,true);go.disabled=false});
    }
  });
}

function fmtD(d){return d.slice(8,10)+"/"+d.slice(5,7)}
function histChart(){
  var h=ls("vx-hist",[]);
  if(h.length<2)return '<section class="counter"><h3>Mon évolution</h3><p style="color:var(--muted)">Ton graphique apparaît quand tu mets à jour ton compteur sur au moins deux jours différents.</p></section>';
  var W=320,H=140,L=34,R=12,T=14,B=26,t0=Date.parse(h[0][0]),t1=Date.parse(h[h.length-1][0]),span=Math.max(t1-t0,864e5);
  function X(d){return L+(Date.parse(d)-t0)/span*(W-L-R)}

  var pts=h.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1)}).join(" ");
  var f=h[0],l=h[h.length-1],xl=X(l[0]).toFixed(1);

  '<polygon class="g-area" points="'+area+'"/><polyline class="g-line" points="'+pts+'"/><circle class="g-dot" cx="'+xl+'" cy="'+Y(l[1]).toFixed(1)+'" r="4.5"/>'+
  '<text class="g-t" x="'+L+'" y="'+(H-8)+'">'+fmtD(f[0])+'</text><text class="g-t" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtD(l[0])+' · '+l[1]+'</text></svg></section>';

function initStatut(){
  var busy=false;

  function render(sb){
    var list=document.getElementById("st-list");if(!list)return;
    var rows=[],online=navigator.onLine!==false,store=false;
    try{localStorage.setItem("vx-test","1");localStorage.removeItem("vx-test");store=true}catch(e){}
    rows.push({c:"ok",n:"Le site",t:"En ligne : la page est chargée."});
    rows.push({c:online?"ok":"bad",n:"Ta connexion",t:online?"Connecté à internet.":"Hors ligne : reconnecte-toi pour avoir le statut à jour."});
    rows.push({c:store?"ok":"or",n:"Stockage sur l'appareil",t:store?"Ta progression peut être enregistrée.":"Bloqué (mode privé ?) : ta progression ne sera pas gardée."});
    if(sb)rows.push({c:sb.ok?"ok":"bad",n:"Comptes et sauvegarde",t:sb.ok?"Serveur opérationnel ("+sb.ms+" ms).":"Le serveur ne répond pas."});
    else rows.push({c:"ok",n:"Comptes",t:"Enregistrés sur cet appareil."});
    var vig=getVig();
    rows.push({c:vig.blackActive?"bk":"ok",n:vig.blackActive?vig.blackTitle:"Noir",t:vig.blackActive?vig.blackDesc:"Pas de niveau critique maximal."});
    rows.push({c:vig.violetActive?"vt":"ok",n:vig.violetActive?vig.violetTitle:"Violet",t:vig.violetActive?vig.violetDesc:"Pas d'urgence maximale."});
    rows.push({c:vig.redActive?"rd":"ok",n:vig.redActive?vig.redTitle:"Rouge",t:vig.redActive?vig.redDesc:"Aucun problème critique."});
    rows.push({c:vig.orangeActive?"or":"ok",n:vig.orangeActive?vig.orangeTitle:"Orange",t:vig.orangeActive?vig.orangeDesc:"Aucun bug signalé."});
    rows.push({c:vig.yellowActive?"yl":"ok",n:vig.yellowActive?vig.yellowTitle:"Jaune",t:vig.yellowActive?vig.yellowDesc:"Aucune attention particulière."});
    rows.push({c:vig.greenActive?"gn":"ok",n:vig.greenActive?vig.greenTitle:"Vert",t:vig.greenActive?vig.greenDesc:"Rien en cours."});
    var lvl="ok",label="Tout fonctionne",order={ok:0,gn:1,yl:2,or:3,rd:4,vt:5,bk:6,bad:7};
    rows.forEach(function(r){if(order[r.c]>order[lvl])lvl=r.c});
    if(lvl==="bad")label="Panne détectée";
    else if(lvl==="bk")label=vig.blackTitle+" : critique maximale";
    else if(lvl==="vt")label=vig.violetTitle+" : urgence extrême";
    else if(lvl==="rd")label=vig.redTitle+" : niveau critique";
    else if(lvl==="or")label=vig.orangeTitle+" : bugs possibles";
    else if(lvl==="yl")label=vig.yellowTitle+" : attention";
    else if(lvl==="gn")label=vig.greenTitle+" : infos en cours";
    document.getElementById("st-big").innerHTML='<div class="sbig '+lvl+'" role="status"><i aria-hidden="true"></i><span>'+esc(label)+'</span></div>';
    document.getElementById("st-sum").textContent=lvl==="ok"?"Aucun problème en ce moment.":"Voici le détail, ligne par ligne.";
    list.innerHTML=rows.map(function(r){return '<div class="srow '+r.c+'"><i aria-hidden="true"></i><div><b>'+esc(r.n)+'</b><span>'+esc(r.t)+'</span></div></div>'}).join("");
    var sl=document.getElementById("st-left"),lt0=vig.until&&!vig.expired?leftText(vig.until):"";
    if(sl)sl.textContent=lt0?"Retour à la normale estimé dans "+lt0+" ("+whenTxt(vig.until)+").":"";
    var sc=document.getElementById("st-sched");
    if(sc)sc.innerHTML=vig.scheduled?'<div class="srow '+vig.scheduled+'"><i aria-hidden="true"></i><div><b>À venir : '+esc(vig.schedTitle||"Vigilance")+'</b><span>Début '+esc(whenTxt(vig.from))+(vig.until?" · fin prévue "+esc(whenTxt(vig.until)):"")+'.</span></div></div>':"";
    var LC={black:"bk",violet:"vt",red:"rd",orange:"or",yellow:"yl",green:"gn"},hh=document.getElementById("st-hist");
    if(hh)hh.innerHTML=vig.history.length?vig.history.map(function(e){return '<div class="srow '+(LC[e.l]||"ok")+'"><i aria-hidden="true"></i><div><b>'+esc(e.t)+'</b><span>'+esc(fmtDT(e.d))+(e.x?" · "+esc(e.x):"")+'</span></div></div>'}).join(""):'<p style="color:var(--muted)">Aucun incident enregistré pour l\'instant.</p>';
    var d=new Date();document.getElementById("st-time").textContent="Dernière vérification : "+two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds())+(vig.updated?" · Vigilance mise à jour le "+fmtDT(vig.updated):"")+(vig.until&&!vig.expired?" · fin prévue le "+fmtDT(vig.until):"")+(vig.history.length?" · Dernier incident le "+fmtDT(vig.history[0].d):"");
  }
  function run(){
    if(busy||!document.getElementById("st-list"))return;busy=true;

      sbCall("GET","/auth/v1/health").then(function(){return{ok:true,ms:Date.now()-t0}}).catch(function(){return{ok:false,ms:0}}).then(function(r){busy=false;render(r)});
    }else{busy=false;render(null)}
  }
